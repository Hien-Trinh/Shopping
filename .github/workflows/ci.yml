name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Required on main. The model job arrives in Phase 6 and stress-smoke in Phase 7 (plan-v1.md, CI).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0 (no floating major tags)
      - run: make check
