[project]
name = "catalog"
version = "0.1.0"
description = "Commerce ingestion pipeline: Listings in, categorized current catalog out."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "deltalake>=1.6.6",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "numpy>=2.3",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "duckdb>=1.5.6",
    "httpx2>=2.13.1",
    "hypothesis>=6",
    "mutmut>=3.8.0",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.13",
]
finetune = [
    "onnx>=1.23.2",
    "torch>=2.14.1",
    "transformers>=5.19.0",
]
laya = [
    "laya-mlx==0.3.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers -m 'not model and not slow'"
markers = [
    "model: needs a real ML model (MLX / embeddings); runs in the macOS CI job",
    "slow: stress suite; runs in stress-smoke CI and locally",
]

[tool.coverage.run]
branch = true
source = ["catalog"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mutmut]
# Pure modules only (plan-v1.md, Testing rules); run with `make mutate`.
source_paths = ["src/catalog/keys.py", "src/catalog/envelope.py", "src/catalog/plan.py", "src/catalog/replay.py", "src/catalog/status.py", "src/catalog/collapse.py"]
pytest_add_cli_args_test_selection = ["tests/unit/"]
also_copy = ["tests/"]
