[project]
name = "catalog"
version = "0.1.0"
description = "Commerce ingestion pipeline: Listings in, categorized current catalog out."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "duckdb>=1.5",
    "hypothesis>=6",
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not model and not slow'"
markers = [
    "model: needs a real ML model (MLX / embeddings); runs in the macOS CI job",
    "slow: stress suite; runs in stress-smoke CI and locally",
]

[tool.coverage.run]
branch = true
source = ["catalog"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
